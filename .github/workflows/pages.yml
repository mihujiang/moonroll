name: Pages

# 在线演示：docs/ 里是纯静态页面 + 预编译好的 engine.wasm，直接整目录发布。
# 不在 Pages 流程里重新编译 wasm —— 提交的产物由 CI 的 demo job 校验过行为
# （selftest），这样部署稳定、和 README 里贴的输出一致。
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN 没有「创建 Pages site」的权限（会返回 Resource not accessible
      # by integration），所以首次必须在 Settings → Pages 里把 Source 选成
      # GitHub Actions，之后本 workflow 才能部署。这里先把原因说清楚，
      # 免得屏幕上是 configure-pages 的原始报错。
      - name: Pages 是否已启用
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" != "200" ]; then
            echo "::error::GitHub Pages 尚未启用（GET /pages 返回 $code）。打开仓库 Settings → Pages → Build and deployment，把 Source 选成 GitHub Actions，然后重跑本 workflow。"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
