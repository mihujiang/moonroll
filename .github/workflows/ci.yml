name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# moonroll 的 demo 与 adapters/phys 依赖物理引擎 weopqrst/moonphys，而后者还没有
# 发布到 mooncakes registry：单独 checkout moonroll 时 `moon check` 会在解析依赖图
# 这一步就失败（"module was not found in the registry"）。
# CI 因此 checkout 两个兄弟仓库再生成与本地一致的 moon.work —— 本地开发也是这样。
# 版本固定到具体 commit，避免对方主线漂移让本仓库莫名其妙变红。
env:
  MOONPHYS_REPO: mihujiang/moonphys
  MOONPHYS_REF: "13df95834be4b15778fa88a57d99ef7d9f7d1213"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: moonroll

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MOONPHYS_REPO }}
          ref: ${{ env.MOONPHYS_REF }}
          path: moonphys

      - name: workspace
        run: |
          printf 'members = [\n  "moonphys",\n  "moonroll",\n]\n' > moon.work
          cat moon.work

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: |
          v=$(moon version --all 2>&1 | tr '\n' ' ')
          printf '%s\n' "$v"
          echo "::notice::moon: $v"

      - name: check
        working-directory: moonroll
        run: |
          if ! out=$(moon check --deny-warn 2>&1); then
            printf '%s\n' "$out"
            msg=$(printf '%s' "$out" | tr -d '%' | tr '\n' '|' | head -c 3000)
            echo "::error::moon check failed: $msg"
            exit 1
          fi

      # 不带路径时 moon fmt 会格式化 workspace 的所有成员（连带兄弟仓库 moonphys，
      # 它的源码还没跟上本仓库的 fmt 规则），所以显式只给本仓库的文件。
      - name: fmt
        working-directory: moonroll
        run: |
          if ! out=$(moon fmt --check $(git ls-files '*.mbt') 2>&1); then
            printf '%s\n' "$out"
            msg=$(printf '%s' "$out" | tr -d '%' | tr '\n' '|' | head -c 3000)
            echo "::error::moon fmt failed: $msg"
            exit 1
          fi

      - name: test wasm-gc
        working-directory: moonroll
        run: moon test --target wasm-gc

      - name: test js
        working-directory: moonroll
        run: moon test --target js

      - name: build native
        working-directory: moonroll
        run: moon build --target native

      # 发布前的最后一道保险：模块必须能自己打包（不联网，只校验自洽）
      - name: package
        working-directory: moonroll
        run: moon package

      - name: examples
        working-directory: moonroll
        run: |
          moon run examples/two_peer
          moon run examples/latency_chart
          moon run examples/desync_demo
          moon run examples/four_peer
          moon run examples/drop_out
          moon run examples/bandwidth
          moon run examples/resync

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: moonroll

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MOONPHYS_REPO }}
          ref: ${{ env.MOONPHYS_REF }}
          path: moonphys

      - name: workspace
        run: |
          printf 'members = [\n  "moonphys",\n  "moonroll",\n]\n' > moon.work
          cat moon.work

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # workspace 模式下产物落在 workspace 根目录的 _build 里
      - name: build demo wasm
        working-directory: moonroll
        run: |
          if ! out=$(moon build --target wasm-gc --release 2>&1); then
            printf '%s\n' "$out"
            msg=$(printf '%s' "$out" | tr -d '%' | tr '\n' '|' | head -c 3000)
            echo "::error::moon build failed: $msg"
            exit 1
          fi
          printf '%s\n' "$out"
          wasm=$(find ../_build -path '*demo/demo.wasm' | head -n 1)
          test -n "$wasm"
          echo "DEMO_WASM=$wasm" >> "$GITHUB_ENV"
          echo "built wasm: $wasm ($(stat -c%s "$wasm")B)"

      # 1800 帧、200ms 延迟 + 50ms 抖动，要求 desync=0
      - name: selftest shipped wasm
        working-directory: moonroll
        run: node tools/check-demo.mjs

      # 同一份源码在不同 moonc 版本 / 不同宿主上产出的字节不完全相同，
      # 所以这里不比对字节，而是让刚构建出来的产物也跑一遍同一套验收。
      - name: selftest freshly built wasm
        working-directory: moonroll
        run: node tools/check-demo.mjs "$DEMO_WASM"

      - name: report wasm drift
        working-directory: moonroll
        run: |
          if cmp -s docs/engine.wasm "$DEMO_WASM"; then
            echo "::notice::docs/engine.wasm 与重建产物逐字节一致"
          else
            echo "::notice::docs/engine.wasm 与重建产物字节不同（工具链版本差异），两者都通过了 selftest：shipped=$(stat -c%s docs/engine.wasm)B built=$(stat -c%s "$DEMO_WASM")B"
          fi
