name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: moon version && moonc version

      - name: check
        run: moon check --deny-warn

      - name: fmt
        run: moon fmt --check

      - name: test wasm-gc
        run: moon test --target wasm-gc

      - name: test js
        run: moon test --target js

      - name: build native
        run: moon build --target native

      - name: examples
        run: |
          moon run examples/two_peer
          moon run examples/latency_chart
          moon run examples/desync_demo
          moon run examples/four_peer
          moon run examples/drop_out
          moon run examples/bandwidth
          moon run examples/resync

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: build demo wasm
        run: |
          moon build --target wasm-gc --release
          wasm=$(find _build -path '*demo/demo.wasm' | head -n 1)
          test -n "$wasm"
          cp "$wasm" docs/engine.wasm

      # 1800 帧、200ms 延迟 + 50ms 抖动，要求 desync=0
      - name: selftest
        run: node tools/check-demo.mjs

      # 产物必须是重新构建后逐字节一致的，避免提交过期的 wasm
      - name: wasm artifact is up to date
        run: git diff --exit-code -- docs/engine.wasm
