name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# moonroll 的 demo 与 adapters/phys 依赖物理引擎 weopqrst/moonphys，而后者还没有
# 发布到 mooncakes registry：单独 checkout moonroll 时 `moon check` 会在解析依赖图
# 这一步就失败（"module was not found in the registry"）。
# CI 因此 checkout 两个兄弟仓库再生成与本地一致的 moon.work —— 本地开发也是这样。
# 版本固定到具体 commit，避免对方主线漂移让本仓库莫名其妙变红。
env:
  MOONPHYS_REPO: mihujiang/moonphys
  MOONPHYS_REF: "13df95834be4b15778fa88a57d99ef7d9f7d1213"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: moonroll

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MOONPHYS_REPO }}
          ref: ${{ env.MOONPHYS_REF }}
          path: moonphys

      - name: workspace
        run: |
          printf 'members = [\n  "moonphys",\n  "moonroll",\n]\n' > moon.work
          cat moon.work

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: moon version --all

      - name: check
        working-directory: moonroll
        run: |
          if ! out=$(moon check --deny-warn 2>&1); then
            printf '%s\n' "$out"
            msg=$(printf '%s' "$out" | tr -d '%' | tr '\n' '|' | head -c 3000)
            echo "::error::moon check failed: $msg"
            exit 1
          fi

      - name: fmt
        working-directory: moonroll
        run: moon fmt --check

      - name: test wasm-gc
        working-directory: moonroll
        run: moon test --target wasm-gc

      - name: test js
        working-directory: moonroll
        run: moon test --target js

      - name: build native
        working-directory: moonroll
        run: moon build --target native

      - name: examples
        working-directory: moonroll
        run: |
          moon run examples/two_peer
          moon run examples/latency_chart
          moon run examples/desync_demo
          moon run examples/four_peer
          moon run examples/drop_out
          moon run examples/bandwidth
          moon run examples/resync

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: moonroll

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MOONPHYS_REPO }}
          ref: ${{ env.MOONPHYS_REF }}
          path: moonphys

      - name: workspace
        run: |
          printf 'members = [\n  "moonphys",\n  "moonroll",\n]\n' > moon.work
          cat moon.work

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # workspace 模式下产物落在 workspace 根目录的 _build 里
      - name: build demo wasm
        working-directory: moonroll
        run: |
          if ! out=$(moon build --target wasm-gc --release 2>&1); then
            printf '%s\n' "$out"
            msg=$(printf '%s' "$out" | tr -d '%' | tr '\n' '|' | head -c 3000)
            echo "::error::moon build failed: $msg"
            exit 1
          fi
          printf '%s\n' "$out"
          wasm=$(find ../_build -path '*demo/demo.wasm' | head -n 1)
          test -n "$wasm"
          cp "$wasm" docs/engine.wasm

      # 1800 帧、200ms 延迟 + 50ms 抖动，要求 desync=0
      - name: selftest
        working-directory: moonroll
        run: node tools/check-demo.mjs

      # 产物必须是重新构建后逐字节一致的，避免提交过期的 wasm
      - name: wasm artifact is up to date
        working-directory: moonroll
        run: git diff --exit-code -- docs/engine.wasm
